name: Build S23 Ultra Kernel with SusFS & AR9271

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libncurses-dev git curl wget zip unzip python3 libelf-dev

      - name: Clone Toolchain & Source
        run: |
          # Клонируем Clang
          git clone --depth=1 --filter=blob:none https://github.com/kdrag0n/proton-clang.git $GITHUB_WORKSPACE/clang
          
          # Клонируем исходники ядра S23 Ultra
          git clone --depth=1 --filter=blob:none https://github.com/samsung-sm8550/kernel_samsung_sm8550-common.git $GITHUB_WORKSPACE/kernel

      - name: Setup KernelSU-Next & SusFS
        run: |
          cd $GITHUB_WORKSPACE/kernel
          
          # Актуальный официальный скрипт установки KernelSU-Next
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s next

          # Клонируем патчи SusFS
          git clone --depth=1 --filter=blob:none https://gitlab.com/simonpunk/susfs4ksu.git -b gki-android14-5.15 $GITHUB_WORKSPACE/susfs
          
          # Копируем и применяем патчи
          cp $GITHUB_WORKSPACE/susfs/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch drivers/kernelsu/ || true
          cp $GITHUB_WORKSPACE/susfs/kernel_patches/fs/* fs/ || true
          cp $GITHUB_WORKSPACE/susfs/kernel_patches/include/linux/* include/linux/ || true
          
          cd drivers/kernelsu
          patch -p1 < 10_enable_susfs_for_ksu.patch || true
          cd ../..
          
          cp $GITHUB_WORKSPACE/susfs/kernel_patches/50_add_susfs_in_kernel*.patch . || true
          for p in 50_add_susfs_in_kernel*.patch; do
            if [ -f "$p" ]; then patch -p1 < "$p" || true; fi
          done

      - name: Configure Kernel (AR9271 & SusFS)
        run: |
          cd $GITHUB_WORKSPACE/kernel
          DEFCONFIG_FILE="arch/arm64/configs/kalama_defconfig"
          
          # Включаем SusFS & KSU
          echo "CONFIG_KSU=y" >> $DEFCONFIG_FILE
          echo "CONFIG_KSU_SUSFS=y" >> $DEFCONFIG_FILE
          echo "CONFIG_SUSFS=y" >> $DEFCONFIG_FILE
          
          # Включаем драйверы для AR9271 (Atheros ath9k_htc)
          echo "CONFIG_CFG80211=m" >> $DEFCONFIG_FILE
          echo "CONFIG_MAC80211=m" >> $DEFCONFIG_FILE
          echo "CONFIG_ATH_COMMON=m" >> $DEFCONFIG_FILE
          echo "CONFIG_ATH9K_HW=m" >> $DEFCONFIG_FILE
          echo "CONFIG_ATH9K_COMMON=m" >> $DEFCONFIG_FILE
          echo "CONFIG_ATH9K_HTC=m" >> $DEFCONFIG_FILE
          echo "CONFIG_ATH9K_HTC_DEBUGFS=y" >> $DEFCONFIG_FILE

      - name: Build Kernel Image
        run: |
          cd $GITHUB_WORKSPACE/kernel
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          
          make O=out ARCH=arm64 kalama_defconfig
          # Добавлен HOSTLD=ld для использования системного линковщика хоста
          make -j$(nproc) O=out ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 HOSTCC=gcc HOSTCXX=g++ HOSTLD=ld Image

      - name: Package to AnyKernel3
        run: |
          git clone --depth=1 --filter=blob:none https://github.com/osm0sis/AnyKernel3 $GITHUB_WORKSPACE/AnyKernel3
          cp $GITHUB_WORKSPACE/kernel/out/arch/arm64/boot/Image $GITHUB_WORKSPACE/AnyKernel3/
          cd $GITHUB_WORKSPACE/AnyKernel3
          zip -r9 $GITHUB_WORKSPACE/S23U-Kernel-SusFS-AR9271.zip *

      - name: Upload Release
        uses: softprops/action-gh-release@v1
        with:
      tag_name: "v${{ github.run_number }}"
          name: "S23 Ultra Kernel (SusFS + AR9271) #${{ github.run_number }}"
          files: |
            S23U-Kernel-SusFS-AR9271.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
